name: Build Dev

on:
  push:
    tags-ignore:
      - '**'

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
            runner: ubuntu-latest
            artifact_suffix: linux-x86_64
          - target: aarch64-linux-musl
            runner: ubuntu-latest
            artifact_suffix: linux-arm64
          - target: aarch64-macos
            runner: macos-latest
            artifact_suffix: macos-arm64
          - target: wasm32-wasi
            runner: ubuntu-latest
            artifact_suffix: wasi
          - target: wasm32-freestanding
            runner: ubuntu-latest
            artifact_suffix: wasm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Get short git hash
        id: git_hash
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            wasm32-wasi)   zig build wasi ;;
            wasm32-freestanding) zig build wasm ;;
            *)             zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe ;;
          esac

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.target }}" in
            wasm32-wasi)
              cp zig-out/wasi/wasmz.wasm dist/wasmz-${{ steps.git_hash.outputs.sha }}-${{ matrix.artifact_suffix }}.wasm
              ;;
            wasm32-freestanding)
              cp zig-out/wasm/wasmz.wasm dist/wasmz-${{ steps.git_hash.outputs.sha }}-${{ matrix.artifact_suffix }}.wasm
              ;;
            *)
              cp zig-out/bin/wasmz dist/wasmz-${{ steps.git_hash.outputs.sha }}-${{ matrix.artifact_suffix }}
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasmz-${{ steps.git_hash.outputs.sha }}-${{ matrix.artifact_suffix }}
          path: dist/wasmz-${{ steps.git_hash.outputs.sha }}-${{ matrix.artifact_suffix }}*
          retention-days: 30
